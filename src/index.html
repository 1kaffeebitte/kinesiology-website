<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Simple Web Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            color: #333;
            text-align: center;
        }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        h1 {
            color: #1a73e8;
        }
    </style>
</head>

<body>

    <!-- Insert your image in the src attribute -->
    <img src="https://picsum.photos" alt="A beautiful placeholder scene">

    <h1>Hello, World!</h1>

    <p>Welcome to this incredibly simple website. It contains only text, clean formatting, and an image.</p>

    <p>You can use this layout for a personal portfolio, a landing page, or to quickly share information online.</p>

</body>

</html>
